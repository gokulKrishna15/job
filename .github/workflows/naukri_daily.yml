name: Daily Automated Naukri Job Applicator & Intelligence Report

on:
  schedule:
    # Primary Schedule: 8:47 AM IST (03:17 AM UTC)
    - cron: '17 3 * * *'
    # Fallback Backup Schedule: 9:30 AM IST (04:00 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub App or Web UI
  push:
    branches:
      - main
    paths:
      - '.github/workflows/naukri_daily.yml'

# ──────────────────────────────────────────────────────────────
# PERMANENT FIX: Only ONE run at a time.
# If a second trigger fires while a run is active, it waits in
# queue (cancel-in-progress: false) so no run is ever lost.
# This eliminates parallel-commit merge conflicts completely.
# ──────────────────────────────────────────────────────────────
concurrency:
  group: naukri-daily-bot
  cancel-in-progress: false

jobs:
  run-naukri-bot:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npx playwright install --with-deps chromium

      - name: Restore Session Authentication
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
        run: |
          mkdir -p auth
          if [ -n "$NAUKRI_STORAGE_STATE" ]; then
            echo "$NAUKRI_STORAGE_STATE" > auth/storage_state.json
            echo "Session state restored from GitHub Secrets."
          else
            echo "WARNING: No session state found in secrets."
          fi

      - name: Run Naukri Auto-Apply Bot (Headless)
        run: |
          python bot.py --headless

      - name: Generate Intelligence Reports & Web Dashboard
        run: |
          python reporter.py
          python publish_report.py

      - name: Commit & Push Log Updates (Conflict-Free Strategy)
        run: |
          git config --global user.name 'Naukri Cloud Bot'
          git config --global user.email 'bot@naukri-auto.local'

          # ── Step 1: Snapshot our freshly generated files into /tmp ──
          mkdir -p /tmp/bot_output/logs /tmp/bot_output/reports /tmp/bot_output/docs
          cp -r logs/.    /tmp/bot_output/logs/    2>/dev/null || true
          cp -r reports/. /tmp/bot_output/reports/ 2>/dev/null || true
          cp -r docs/.    /tmp/bot_output/docs/    2>/dev/null || true

          # ── Step 2: Fetch and hard-reset to whatever remote main is NOW ──
          # Absorbs any commits pushed by a parallel run or external actor.
          # No rebase, no merge, no conflicts — we just start from remote HEAD.
          git fetch origin main
          git reset --hard origin/main

          # ── Step 3: Overlay our generated files on top of fresh remote state ──
          cp -r /tmp/bot_output/logs/.    logs/    2>/dev/null || true
          cp -r /tmp/bot_output/reports/. reports/ 2>/dev/null || true
          cp -r /tmp/bot_output/docs/.    docs/    2>/dev/null || true

          # ── Step 4: Stage & commit only if anything actually changed ──
          git add logs/ reports/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update daily job reports [skip ci]"
            git push origin main
            echo "✅ Reports committed and pushed successfully."
          else
            echo "ℹ️  No changes to commit."
          fi

      - name: Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
